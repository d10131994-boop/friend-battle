name: AI branch build

on:
  push:
    branches:
      - '**-AI*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install dependencies and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npx eslint src/database src/multiplayer
