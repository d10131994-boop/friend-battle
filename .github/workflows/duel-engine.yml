name: Duel engine tests
on:
  pull_request:
    branches:
      - '**'
      - '!**/*-AI'
    paths:
      - 'src/games/Duel/**'
      - '.github/workflows/duel-engine.yml'
  push:
    branches:
      - 'friend-battle-07/duel/*-AI'
      - 'friend-battle-07/duel/*-AI-*'
    paths:
      - 'src/games/Duel/**'
      - '.github/workflows/duel-engine.yml'
jobs:
  duel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build complete Friend Battle application
        run: npm run build
      - name: Compile isolated duel tests
        run: npx tsc --ignoreConfig --target es2022 --module nodenext --moduleResolution nodenext --types node --skipLibCheck --outDir /tmp/duel-tests src/games/Duel/duelEngine.ts src/games/Duel/duelEngine.test.ts src/games/Duel/duelMatch.ts src/games/Duel/duelMatch.test.ts src/games/Duel/duelChoice.ts src/games/Duel/duelChoice.test.ts src/games/Duel/duelPresentation.ts src/games/Duel/duelPresentation.test.ts src/games/Duel/duelProtocol.ts src/games/Duel/duelProtocol.test.ts src/games/Duel/duelServerState.ts src/games/Duel/duelServerState.test.ts src/games/Duel/duelSnapshot.ts src/games/Duel/duelSnapshot.test.ts
      - name: Run exhaustive combat tests
        run: |
          echo '{"type":"module"}' > /tmp/duel-tests/package.json
          node --test /tmp/duel-tests/*.test.js
